<svg xmlns="http://www.w3.org/2000/svg" width="360" height="164" viewBox="0 0 360 164" role="img" aria-label="Auto blanco visto desde arriba, orientado hacia la derecha">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fcfd"/>
      <stop offset=".17" stop-color="#b2c3cc"/>
      <stop offset=".29" stop-color="#f9ffff"/>
      <stop offset=".52" stop-color="#eef6f9"/>
      <stop offset=".76" stop-color="#f8fcfe"/>
      <stop offset=".88" stop-color="#aab9c2"/>
      <stop offset="1" stop-color="#f6fafb"/>
